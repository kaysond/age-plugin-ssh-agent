version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # version updates off; security updates (repo setting) still open PRs
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # must match age-core's bech32; bumped alongside age-core
      - dependency-name: bech32
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      # age crates share types and must move together
      age:
        applies-to: security-updates
        patterns: [age, age-core, age-plugin]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci

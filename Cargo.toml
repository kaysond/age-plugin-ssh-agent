[package]
name = "age-plugin-ssh-agent"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
age = "0.12.1"
age-core = "0.12.0"
age-plugin = "0.7.0"
base64 = "0.22"
# match age-core's bech32 because HRP changed in 0.12.x
bech32 = "0.11.1"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
hkdf = "0.13.0"
rand = "0.10.3"
sha2 = "0.11.0"
ssh-agent-lib = { version = "0.6.0", default-features = false }
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1.9.0"

[[bin]]
name = "age-plugin-ssh-agent"
path = "src/main.rs"
